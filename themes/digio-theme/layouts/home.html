{{ define "main" }}
{{ $p := .Params }}
<div class="grid lg:grid-cols-2 gap-4">
	<div class="not-prose flex cursor-default flex-col space-y-4 rounded-lg border border-white p-4">
		<a href="/me">
			<img src="{{ or $p.portraitImage "/portrait.png" }}" alt="Portrait" class="w-full h-full">
		</a>
	</div>
	<div class="grid lg:grid-rows-2 gap-4">
		<div class="not-prose flex cursor-default flex-col space-y-2 rounded-lg border border-white p-6">
			<a href="/status.png">
				<img src="{{ or $p.statusImage "/status.png" }}" alt="Status" class="self-start">
			</a>
		</div>
		<div class="not-prose flex cursor-default flex-col space-y-2 rounded-lg border border-white p-6">
			<a href="/watching.png">
				<img src="{{ or $p.watchingImage "/watching.png" }}" alt="Watching" class="self-start">
			</a>
		</div>
	</div>
</div>
{{ end }}
